---
- name: Administrar servidores con Ansible
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "El nombre del host es: {{ ansible_hostname }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "El sistema operativo es: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio /tmp/ansible-demo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear archivo info.txt con el nombre del servidor y el sistema operativo
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ ansible_hostname }}
          Sistema Operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}
        mode: '0644'

    - name: Crear mediante un loop los directorios (logs, backup, config)
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar un mensaje únicamente cuando el sistema operativo sea Ubuntu
      ansible.builtin.debug:
        msg: "¡Confirmado! Este servidor está ejecutando Ubuntu ({{ ansible_distribution_release }})."
      when: ansible_distribution == "Ubuntu"
